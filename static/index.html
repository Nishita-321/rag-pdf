<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG PDF</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1c2026; --muted: #68707d;
    --line: #dfe3e8; --accent: #2f6fde; --accent-text: #ffffff;
    --user: #e7effd; --error: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --panel: #1d2128; --text: #e6e9ee; --muted: #98a1ae;
      --line: #2e343d; --accent: #5b93f5; --accent-text: #0e1116;
      --user: #25324a; --error: #ff7b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .app {
    display: grid; grid-template-columns: 300px 1fr; gap: 16px;
    max-width: 1100px; height: 100vh; margin: 0 auto; padding: 16px;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    display: flex; flex-direction: column; min-height: 0;
  }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 12px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .side { padding: 16px; gap: 16px; }
  .muted { color: var(--muted); font-size: 13px; }
  button {
    font: inherit; border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer;
    background: var(--accent); color: var(--accent-text); font-weight: 600;
  }
  button:disabled { opacity: .5; cursor: default; }
  .upload { width: 100%; }
  #status { min-height: 20px; margin-top: 8px; }
  #status.error { color: var(--error); }
  #docs { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
  #docs li {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border: 1px solid transparent; border-radius: 8px; cursor: pointer;
  }
  #docs li:hover { background: var(--bg); }
  #docs li.active { border-color: var(--accent); background: var(--bg); }
  #docs .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #docs .del { background: none; color: var(--muted); padding: 2px 6px; font-weight: 400; }
  #docs .del:hover { color: var(--error); }
  .chat-head { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.bot { align-self: flex-start; border: 1px solid var(--line); }
  .msg.error { color: var(--error); }
  details { margin-top: 8px; font-size: 13px; color: var(--muted); }
  summary { cursor: pointer; }
  .src { margin-top: 8px; padding: 8px 10px; border-left: 3px solid var(--line); }
  .src b { color: var(--text); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  #question {
    flex: 1; font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px;
  }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; height: auto; }
    .chat { height: 70vh; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="panel side">
    <div>
      <h1>RAG PDF</h1>
      <div class="muted">Upload PDFs, then ask questions about them.</div>
    </div>
    <div>
      <input type="file" id="file" accept="application/pdf,.pdf" hidden>
      <button class="upload" id="uploadBtn">Upload PDF</button>
      <div id="status" class="muted"></div>
    </div>
    <div style="display:flex;flex-direction:column;min-height:0">
      <h2>Documents</h2>
      <ul id="docs"></ul>
    </div>
  </aside>

  <main class="panel chat">
    <div class="chat-head muted" id="scope"></div>
    <div id="messages"></div>
    <form id="askForm">
      <input id="question" placeholder="Ask a question…" autocomplete="off" maxlength="2000">
      <button id="askBtn">Ask</button>
    </form>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
let docs = [];
let selected = null;   // doc_id, or null = search all documents

// Small helper: build an element with text, never innerHTML (safe against HTML in PDFs).
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

async function api(path, options) {
  const res = await fetch(path, options);
  if (res.status === 204) return null;
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = body.detail;
    throw new Error(typeof d === "string" ? d : d?.[0]?.msg || `Request failed (${res.status})`);
  }
  return body;
}

function setStatus(text, isError) {
  $("status").textContent = text;
  $("status").className = isError ? "error" : "muted";
}

function renderDocs() {
  const list = $("docs");
  list.replaceChildren();
  const all = el("li", selected === null ? "active" : "");
  all.append(el("span", "name", `All documents (${docs.length})`));
  all.onclick = () => { selected = null; renderDocs(); };
  list.append(all);

  for (const d of docs) {
    const li = el("li", selected === d.doc_id ? "active" : "");
    li.title = `${d.name} · ${d.pages} pages · ${d.chunks} chunks`;
    li.append(el("span", "name", d.name));
    const del = el("button", "del", "✕");
    del.title = "Remove";
    del.onclick = async (ev) => {
      ev.stopPropagation();
      if (!confirm(`Remove "${d.name}"?`)) return;
      try {
        await api(`/documents/${d.doc_id}`, { method: "DELETE" });
        if (selected === d.doc_id) selected = null;
        await loadDocs();
      } catch (e) { setStatus(e.message, true); }
    };
    li.append(del);
    li.onclick = () => { selected = d.doc_id; renderDocs(); };
    list.append(li);
  }

  const current = docs.find((d) => d.doc_id === selected);
  $("scope").textContent = !docs.length ? "No documents yet. Upload a PDF to start."
    : current ? `Asking: ${current.name}` : "Asking: all documents";
  $("askBtn").disabled = !docs.length;
}

async function loadDocs() {
  docs = await api("/documents");
  if (!docs.some((d) => d.doc_id === selected)) selected = null;
  renderDocs();
}

$("uploadBtn").onclick = () => $("file").click();
$("file").onchange = async () => {
  const file = $("file").files[0];
  if (!file) return;
  const form = new FormData();
  form.append("file", file);
  $("uploadBtn").disabled = true;
  setStatus(`Indexing ${file.name}…`);
  try {
    const doc = await api("/documents", { method: "POST", body: form });
    setStatus(`Indexed ${doc.chunks} chunks from ${doc.pages} pages.`);
    selected = doc.doc_id;
    await loadDocs();
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    $("uploadBtn").disabled = false;
    $("file").value = "";
  }
};

function addMessage(cls, text) {
  const m = el("div", `msg ${cls}`, text);
  $("messages").append(m);
  $("messages").scrollTop = $("messages").scrollHeight;
  return m;
}

$("askForm").onsubmit = async (ev) => {
  ev.preventDefault();
  const question = $("question").value.trim();
  if (!question || !docs.length) return;
  $("question").value = "";
  addMessage("user", question);
  const bot = addMessage("bot", "Thinking…");
  $("askBtn").disabled = true;
  try {
    const res = await api("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, doc_id: selected }),
    });
    bot.textContent = res.answer;
    const details = el("details");
    details.append(el("summary", "", `Sources (${res.sources.length})`));
    for (const s of res.sources) {
      const src = el("div", "src");
      src.append(el("b", "", `${s.name}, p. ${s.page}`), el("div", "", s.text));
      details.append(src);
    }
    bot.append(details);
  } catch (e) {
    bot.textContent = e.message;
    bot.classList.add("error");
  } finally {
    $("askBtn").disabled = !docs.length;
    $("messages").scrollTop = $("messages").scrollHeight;
    $("question").focus();
  }
};

loadDocs().catch((e) => setStatus(e.message, true));
</script>
</body>
</html>
