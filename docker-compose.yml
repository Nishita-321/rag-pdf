name: rag-pdf

services:
  app:
    build: .
    image: rag-pdf
    ports:
      - "${PORT:-8000}:8000"        # host:container. PORT=9000 docker compose up  -> localhost:9000
    env_file: .env                  # GEMINI_API_KEY and the other settings
    environment:
      CHROMA_PATH: /data/chroma_db  # always store the database on the volume
    volumes:
      - rag_data:/data              # survives restarts and rebuilds
    restart: unless-stopped

  # ---- Monitoring (optional): docker compose --profile monitoring up -d ----
  # Ports are bound to 127.0.0.1 so they are reachable from this machine only.

  prometheus:                       # collects and stores metrics
    image: prom/prometheus:v3.1.0
    profiles: [monitoring]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  loki:                             # stores logs
    image: grafana/loki:3.3.2
    profiles: [monitoring]
    volumes:
      - loki_data:/loki
    restart: unless-stopped

  alloy:                            # ships container logs to Loki
    image: grafana/alloy:v1.5.1
    profiles: [monitoring]
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./monitoring/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    restart: unless-stopped

  grafana:                          # dashboards and log search
    image: grafana/grafana:11.4.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/rag-pdf.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus, loki]
    restart: unless-stopped

volumes:
  rag_data:
  prometheus_data:
  loki_data:
  grafana_data:
